name: Auto Intel Daily Pipeline

on:
  schedule:
    - cron: "0 4 * * *"   # 4:00 AM UTC = 9:30 AM IST daily
  workflow_dispatch:        # allow manual trigger from GitHub UI
    inputs:
      force_download:
        description: "Force re-download PDFs"
        required: false
        default: "false"
      oems:
        description: "Specific OEM keys (space separated, blank = all)"
        required: false
        default: ""

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write   # needed to commit updated CSVs

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Python setup ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Create required directories ───────────────────────────────────────
      - name: Create directories
        run: |
          mkdir -p data logs

      # ── Run pipeline ──────────────────────────────────────────────────────
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_download }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ github.event.inputs.oems }}" ]; then
            ARGS="$ARGS --oems ${{ github.event.inputs.oems }}"
          fi
          python pipeline/run.py $ARGS

      # ── Commit updated data ───────────────────────────────────────────────
      - name: Commit updated datasets
        run: |
          git config user.name  "Auto Intel Bot"
          git config user.email "auto-intel-bot@noreply.github.com"
          git add data/normalized.csv data/granular.csv data/filing_status.csv
          git add logs/ || true
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "data: pipeline run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Pipeline summary
        if: always()
        run: |
          echo "Pipeline run complete"
          if [ -f logs/run_history.jsonl ]; then
            tail -1 logs/run_history.jsonl
          fi
