name: Auto Data Pipeline — Daily baseline

# Runs once a day at 09:30 IST. The heavy lifting (multi-run-per-day during
# the 1st-8th filing window) is handled by auto-data-pipeline-filing-window.yml.

on:
  workflow_dispatch:
    inputs:
      force_download:
        description: "Force re-download PDFs"
        required: false
        default: "false"
      oems:
        description: "Specific OEM keys (space separated, blank = all active)"
        required: false
        default: ""
  schedule:
    # 04:00 UTC = 09:30 IST
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        working-directory: auto_intel_platform/auto_intel
        run: mkdir -p data logs

      - name: Run auto monthly pipeline
        working-directory: auto_intel_platform/auto_intel
        # Pipeline exits 0 even when no new PDFs found — that is normal.
        # It only exits non-zero on a genuine unhandled exception.
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_download }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ github.event.inputs.oems }}" ]; then
            ARGS="$ARGS --oems ${{ github.event.inputs.oems }}"
          fi
          python -m pipeline.run $ARGS
        continue-on-error: true
        id: pipeline

      # ── Data integrity check ──────────────────────────────────────────────
      # --critical-only: fail the job ONLY on real data corruption (arithmetic
      # errors, duplicate rows). Missing/late filings are EXPECTED and must NOT
      # trigger failure emails.
      - name: Run data integrity check
        working-directory: auto_intel_platform/auto_intel
        run: python pipeline/integrity_check.py --critical-only
        continue-on-error: true
        id: integrity

      # ── Surface reports in Actions summary ────────────────────────────────
      - name: Surface reports
        if: always()
        working-directory: auto_intel_platform/auto_intel
        run: |
          # Integrity report
          latest_int=$(ls -1 logs/integrity_*.md 2>/dev/null | sort | tail -1 || true)
          if [ -n "$latest_int" ]; then
            echo "## Data Integrity Report" >> $GITHUB_STEP_SUMMARY
            cat "$latest_int" >> $GITHUB_STEP_SUMMARY
          fi
          # Close report
          latest=$(ls -1 logs/close_report_*.md 2>/dev/null | sort | tail -1 || true)
          if [ -n "$latest" ]; then
            echo "## Monthly Close Report" >> $GITHUB_STEP_SUMMARY
            cat "$latest" >> $GITHUB_STEP_SUMMARY
          fi
          # Run summary
          echo "## Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Pipeline: ${{ steps.pipeline.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integrity: ${{ steps.integrity.outcome }}" >> $GITHUB_STEP_SUMMARY
          if [ -f data/normalized.csv ]; then
            rows=$(tail -n +2 data/normalized.csv | wc -l)
            echo "- Dataset rows: $rows" >> $GITHUB_STEP_SUMMARY
          fi

      # ── Commit updated data (no external action — plain git) ──────────────
      - name: Commit updated datasets
        if: always()
        working-directory: auto_intel_platform/auto_intel
        run: |
          git config user.name  "Auto Intel Bot"
          git config user.email "auto-intel-bot@noreply.github.com"
          git add data/normalized.csv data/granular.csv data/filing_status.csv 2>/dev/null || true
          git add logs/ 2>/dev/null || true
          # Only commit if there are actual staged changes
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Pull then push to handle concurrent runs gracefully
            git pull --rebase origin main || true
            git push origin main || echo "Push failed — will retry on next run"
          fi

      # ── Fail ONLY on CRITICAL data corruption ─────────────────────────────
      # With --critical-only, integrity exits 1 only for arithmetic/duplicate
      # corruption — a genuine bug worth an email. "No new data" and missing
      # filings are normal and stay green (no daily failure email).
      - name: Fail on critical data corruption
        if: steps.integrity.outcome == 'failure'
        run: |
          echo "::error ::CRITICAL data corruption detected (arithmetic or duplicate rows)."
          echo "This is a real data bug. Open dashboard > Review Queue to inspect."
          exit 1
