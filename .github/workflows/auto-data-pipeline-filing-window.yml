name: Auto Data Pipeline — Filing window (1st-8th of month)

# Indian OEMs file monthly sales data in the first week of each month.
# This workflow fires 4 times per day from the 1st to the 8th to capture
# each filing as soon as it lands.

on:
  workflow_dispatch:
  schedule:
    # 04:00 / 08:00 / 12:00 / 16:00 UTC = 09:30 / 13:30 / 17:30 / 21:30 IST
    - cron: "0 4,8,12,16 1-8 * *"

permissions:
  contents: write

jobs:
  filing-window:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        working-directory: auto_intel_platform/auto_intel
        run: mkdir -p data logs

      - name: Run filing-window fetch
        working-directory: auto_intel_platform/auto_intel
        run: python -m pipeline.run
        continue-on-error: true
        id: pipeline

      # ── Data integrity check ──────────────────────────────────────────────
      - name: Run data integrity check
        working-directory: auto_intel_platform/auto_intel
        run: python pipeline/integrity_check.py
        continue-on-error: true
        id: integrity

      # ── Surface reports ───────────────────────────────────────────────────
      - name: Surface close report
        if: always()
        working-directory: auto_intel_platform/auto_intel
        run: |
          latest=$(ls -1 logs/close_report_*.md 2>/dev/null | sort | tail -1 || true)
          if [ -n "$latest" ]; then
            echo "## Monthly Close Report" >> $GITHUB_STEP_SUMMARY
            cat "$latest" >> $GITHUB_STEP_SUMMARY
          fi
          # Alert on filing SLA breach
          latest_json=$(ls -1 logs/close_report_*.json 2>/dev/null | sort | tail -1 || true)
          if [ -n "$latest_json" ]; then
            missing=$(python -c "import json; d=json.load(open('$latest_json')); print(d.get('filings_missing',0))" 2>/dev/null || echo "0")
            late=$(python -c "import json; d=json.load(open('$latest_json')); print(d.get('filings_late',0))" 2>/dev/null || echo "0")
            if [ "$missing" -gt 0 ] || [ "$late" -gt 0 ]; then
              echo "::warning ::Filing SLA breach: $missing missing, $late late"
            fi
          fi

      # ── Commit updated data (plain git, no external action) ───────────────
      - name: Commit refreshed data
        if: always()
        working-directory: auto_intel_platform/auto_intel
        run: |
          git config user.name  "Auto Intel Bot"
          git config user.email "auto-intel-bot@noreply.github.com"
          git add data/normalized.csv data/granular.csv data/filing_status.csv 2>/dev/null || true
          git add logs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: filing-window refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push origin main || echo "Push failed — will retry on next run"
          fi

      # ── Fail only on critical integrity issues ────────────────────────────
      - name: Fail on critical integrity issues
        if: steps.integrity.outcome == 'failure'
        run: |
          echo "CRITICAL or HIGH data integrity issues found."
          echo "Open dashboard > Review Queue > Enter Data Manually to fix."
          exit 1
